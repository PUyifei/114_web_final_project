<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="商品管理後台，快速掌握商品與庫存狀態。"
    />
    <title>商品總覽｜商品管理後台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主要導覽">
        <a class="brand" href="/" aria-label="商品管理後台首頁">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 10.5 12 4l7 6.5V20H5v-9.5Z" />
              <path d="M9 20v-6h6v6M3.5 10.5 12 3l8.5 7.5" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>商品管理後台</strong>
            <small>STORE ADMIN</small>
          </span>
        </a>

        <p class="nav-label">工作台</p>
        <nav>
          <a class="nav-link active" href="#overview" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1.5" />
              <rect x="14" y="4" width="6" height="6" rx="1.5" />
              <rect x="4" y="14" width="6" height="6" rx="1.5" />
              <rect x="14" y="14" width="6" height="6" rx="1.5" />
            </svg>
            商品總覽
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="store-card">
            <span class="store-avatar">店</span>
            <span class="store-details">
              <strong>商店帳戶</strong>
              <small>商店管理員</small>
            </span>
            <span class="online-dot" aria-label="線上"></span>
          </div>
          <p class="sidebar-footnote">讓每件好物，都被好好看見。</p>
        </div>
      </aside>

      <main class="main-content" id="overview">
        <header class="topbar">
          <div class="breadcrumb"><span>工作台</span><span>/</span><strong>商品總覽</strong></div>
          <div class="topbar-right">
            <span class="connection"><span class="connection-dot"></span>管理後台</span>
            <span class="topbar-avatar" aria-hidden="true">店</span>
          </div>
        </header>

        <div class="page-content">
          <section class="page-heading">
            <div>
              <p class="eyebrow">STORE OVERVIEW</p>
              <h1>商品總覽<span class="heading-period">.</span></h1>
              <p class="page-subtitle">整理好每一件商品，讓日常多一點美好。</p>
            </div>
            <a class="primary-button heading-button" href="#add-product">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              新增商品
            </a>
          </section>

          <section class="stats-grid" aria-label="商品庫存摘要">
            <article class="stat-card">
              <div class="stat-topline">
                <span>商品總數</span>
                <span class="stat-icon lavender">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" />
                    <path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21" />
                  </svg>
                </span>
              </div>
              <strong class="stat-value" id="total-products">—</strong>
              <span class="stat-caption">商品目錄品項</span>
            </article>
            <article class="stat-card">
              <div class="stat-topline">
                <span>庫存總量</span>
                <span class="stat-icon mint">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
                    <path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21" />
                  </svg>
                </span>
              </div>
              <strong class="stat-value" id="total-stock">—</strong>
              <span class="stat-caption">所有商品的現有庫存</span>
            </article>
            <article class="stat-card">
              <div class="stat-topline">
                <span>低庫存提醒</span>
                <span class="stat-icon peach">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 2.8 19h18.4L12 3Z" />
                    <path d="M12 9v4.5M12 17h.01" />
                  </svg>
                </span>
              </div>
              <strong class="stat-value" id="low-stock-count">—</strong>
              <span class="stat-caption">庫存少於 6 件</span>
            </article>
          </section>

          <section class="panel add-panel" id="add-product">
            <div class="panel-heading">
              <div class="panel-title-group">
                <span class="section-marker" aria-hidden="true"></span>
                <div>
                  <h2>新增商品</h2>
                  <p>填寫商品資訊，將新品加入你的商店。</p>
                </div>
              </div>
            </div>
            <form id="product-form" class="product-form">
              <label class="field">
                <span>商品名稱</span>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="例如：手作陶杯"
                  autocomplete="off"
                  required
                />
              </label>
              <label class="field">
                <span>商品價格</span>
                <span class="input-with-prefix">
                  <span aria-hidden="true">NT$</span>
                  <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="0"
                    min="0"
                    step="0.01"
                    required
                  />
                </span>
              </label>
              <label class="field">
                <span>初始庫存</span>
                <input
                  type="number"
                  id="stock"
                  name="stock"
                  placeholder="0"
                  min="0"
                  step="1"
                  value="0"
                />
              </label>
              <button class="primary-button submit-button" type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <span>建立商品</span>
              </button>
            </form>
          </section>

          <section class="panel inventory-panel">
            <div class="inventory-heading">
              <div class="panel-title-group">
                <span class="section-marker" aria-hidden="true"></span>
                <div>
                  <h2>商品清單</h2>
                  <p>檢視並掌握目前商品與庫存狀況。</p>
                </div>
              </div>
              <label class="search-box">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10.8" cy="10.8" r="6.8" />
                  <path d="m16 16 4.5 4.5" />
                </svg>
                <input
                  id="product-search"
                  type="search"
                  placeholder="搜尋商品名稱"
                  aria-label="搜尋商品名稱"
                />
              </label>
            </div>
            <p class="status-message" id="status-message" role="status" hidden></p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">商品</th>
                    <th scope="col">價格</th>
                    <th scope="col">庫存數量</th>
                    <th scope="col">庫存狀態</th>
                  </tr>
                </thead>
                <tbody id="product-list"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <span id="results-count">載入商品中…</span>
              <span class="footer-note"><span class="footer-sparkle">✳</span> 用心挑選，日常更美</span>
            </div>
          </section>
          <footer class="page-footer">商品管理工作台 <span>·</span> 管理商品與庫存更簡單</footer>
        </div>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
